name: Grant write access to merged PR authors

# Grants Write access after a PR is merged, or for usernames passed to workflow_dispatch.
# This workflow never checks out PR code; it only reads the event payload and calls the GitHub API.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      usernames:
        description: Comma-separated GitHub usernames to grant Write access
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  grant-write:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.user.type == 'User' &&
       github.event.pull_request.user.login != github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - name: Check admin token
        id: token
        env:
          ADMIN_TOKEN: ${{ secrets.COLLABORATOR_PAT }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COLLABORATOR_PAT secret is missing; skipping collaborator grant."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant Write access
        if: steps.token.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COLLABORATOR_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const manual = String(context.payload.inputs?.usernames || '')
              .split(',')
              .map((name) => name.trim())
              .filter(Boolean);
            const prAuthor = context.payload.pull_request?.user?.login;
            const authors = context.eventName === 'workflow_dispatch'
              ? manual
              : [prAuthor].filter(Boolean);

            for (const username of [...new Set(authors)]) {
              if (username.toLowerCase() === owner.toLowerCase()) {
                console.log(`Skipping repository owner ${username}.`);
                continue;
              }
              if (context.eventName !== 'workflow_dispatch' &&
                  context.payload.pull_request?.user?.type !== 'User') {
                console.log(`Skipping non-user author ${username}.`);
                continue;
              }

              let current = null;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username,
                });
                current = data.permission;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (['admin', 'maintain', 'push'].includes(current)) {
                console.log(`${username} already has ${current || 'access'}; no change.`);
                continue;
              }

              await github.rest.repos.addCollaborator({
                owner,
                repo,
                username,
                permission: 'push',
              });
              console.log(`Granted Write access to ${username}.`);
            }
