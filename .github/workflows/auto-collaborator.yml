name: Grant write access to merged PR authors

# Adds the PR author as a Write collaborator after their PR is merged.
# This workflow never checks out PR code; it only reads the event payload and calls the GitHub API.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  grant-write:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check admin token
        id: token
        env:
          ADMIN_TOKEN: ${{ secrets.COLLABORATOR_PAT }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COLLABORATOR_PAT secret is missing; skipping collaborator grant."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add push collaborator
        if: steps.token.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COLLABORATOR_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const username = context.payload.pull_request.user.login;

            let current = null;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username,
              });
              current = data.permission;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (['admin', 'maintain', 'push'].includes(current)) {
              console.log(`${username} already has ${current || 'access'}; no change.`);
              return;
            }

            await github.rest.repos.addCollaborator({
              owner,
              repo,
              username,
              permission: 'push',
            });
            console.log(
              `Invited ${username} as a write collaborator after merged PR #${context.payload.pull_request.number}.`
            );
